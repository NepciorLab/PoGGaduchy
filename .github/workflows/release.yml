name: Release

# Wydanie powstaje po wypchnięciu tagu, np.:  git tag v1.2.0 && git push origin v1.2.0
# Program sprawdza najnowsze wydanie i pobiera plik PoGGaduchy-<wersja>-win-x64.zip razem z sumą SHA-256
# (PoGGaduchy-<wersja>-win-x64.zip.sha256), patrz Source/UpdateService.cs.
# Podpis autora (.zip.sig) dodaje się PO wydaniu, lokalnie: tools\podpisz-wydanie.ps1 -Wersja <wersja>
# (klucz prywatny celowo nie jest sekretem GitHuba - inaczej przejęcie konta pozwoliłoby podpisać dowolny plik).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build single-file exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish Source/PoGGaduchy.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:Version=$version -o out
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          $zip = "PoGGaduchy-$version-win-x64.zip"
          Compress-Archive -Path out/PoGGaduchy.exe -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "PoGGaduchy-$env:VERSION-win-x64.zip"
          # Nagłówek (informacja o AI, instalacja) + automatycznie wygenerowana lista zmian.
          $header = (Get-Content .github/release-header.md -Raw -Encoding utf8).Replace('{VERSION}', $env:VERSION).Replace('{REPOSITORY}', $env:GITHUB_REPOSITORY)
          $changes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$tag --jq .body
          Set-Content -Path release-notes.md -Value ($header + "`n`n" + $changes) -Encoding utf8
          gh release create $tag $zip "$zip.sha256" --title "PoGGaduchy $env:VERSION" --notes-file release-notes.md
